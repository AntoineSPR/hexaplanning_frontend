<button
  type="button"
  class="quest-card"
  [class.on-hold]="isOnHold"
  (click)="openDetails()"
  (keydown.enter)="openDetails()"
  [style.background]="
    isInProgress
      ? 'linear-gradient(to right, var(--theme-color) 0%, var(--light-theme-color) ' + advancement + '%, transparent ' + advancement + '%)'
      : isCompleted
      ? 'linear-gradient(to right, var(--theme-color), var(--light-theme-color))'
      : null
  ">
  <!-- Case à cocher -->
  <input
    type="checkbox"
    class="quest-checkbox"
    [checked]="quest.statusId === _questService.statusDoneId"
    (change)="toggleStatus()"
    (click)="$event.stopPropagation()"
    aria-label="Marquer cette tâche comme terminée" />

  <!-- Titre de la quête -->
  <span class="quest-title">
    {{ quest.title }}
  </span>

  @if (isOnHold) {
    <i class="pi pi-pause on-hold-icon" aria-label="En attente" title="En attente"></i>
  }

  <app-theme-icon [color]="themeColor" [alt]="themeAltText" [size]="32" />
</button>
